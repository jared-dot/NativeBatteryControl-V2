name: Build Native Battery Control v0.4.0
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify and extract source
        run: |
          echo "df54a27999fb6098a524bf518d10502156011fbbc43f056d0f7937801ef66a7a  NativeBatteryControl-v0.4.0-source.zip" | sha256sum -c -
          mkdir verified-source
          unzip -q NativeBatteryControl-v0.4.0-source.zip -d verified-source
          cat verified-source/app/build.gradle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check Android SDK
        id: sdk
        run: |
          if [ -f "$ANDROID_HOME/platforms/android-35/android.jar" ] && [ -x "$ANDROID_HOME/build-tools/35.0.0/aapt" ] && [ -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: android-actions/setup-android@v4
        if: steps.sdk.outputs.ready != 'true'
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true
      - name: Compile APK
        working-directory: verified-source
        run: gradle --no-daemon clean :app:assembleDebug
      - name: Verify APK and version
        run: |
          APK=verified-source/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > apk-info.txt
          cat apk-info.txt
          grep -F "versionName='0.4.0'" apk-info.txt
          grep -F "versionCode='4'" apk-info.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          cp "$APK" NativeBatteryControl-v0.4.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VERIFIED-NativeBatteryControl-v0.4.0
          path: NativeBatteryControl-v0.4.0.apk
          if-no-files-found: error 
